name: Deploy Backend

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run database migrations before deploying
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # ── Notify start ──────────────────────────────────────────────
  notify-start:
    name: Notify start
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "🚀 <b>[Backend]</b> Deploy bắt đầu — <code>${{ github.ref_name }}</code> (${{ github.sha }}) message: ${{ github.event.head_commit.message }}"

  test:
    name: Test
    needs: notify-start
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -shuffle=on ./...

      - name: Notify test result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} <b>[Backend]</b> Test: ${{ job.status == 'success' && 'passed' || 'failed' }}"

  migrate:
    name: Migrate database
    needs: [notify-start, test]
    if: github.event_name == 'push' || inputs.run_migrations
    runs-on: self-hosted
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25"
          cache: true

      - name: Validate migration configuration
        shell: bash
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::error::Missing repository secret: DATABASE_URL"
            exit 1
          fi

      - name: Install migrate
        run: go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.1

      - name: Run migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Notify migrate result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} <b>[Backend]</b> Migrate: ${{ job.status == 'success' && 'passed' || 'failed' }}"

  deploy:
    name: Deploy to Cloud Run
    needs: [notify-start, test, migrate]
    if: ${{ always() && needs.test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') }}
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
      JWT_ACCESS_TTL: ${{ vars.JWT_ACCESS_TTL }}
      JWT_REFRESH_TTL: ${{ vars.JWT_REFRESH_TTL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
      GEOCODER_ENABLED: ${{ vars.GEOCODER_ENABLED }}
      LOCATIONIQ_API_KEY: ${{ secrets.LOCATIONIQ_API_KEY }}
      RATE_LIMIT_ENABLED: ${{ vars.RATE_LIMIT_ENABLED }}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${{ vars.RATE_LIMIT_REQUESTS_PER_MINUTE }}
      RATE_LIMIT_BURST: ${{ vars.RATE_LIMIT_BURST }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      GOOGLE_PHOTOS_CLIENT_ID: ${{ secrets.GOOGLE_PHOTOS_CLIENT_ID }}
      GOOGLE_PHOTOS_CLIENT_SECRET: ${{ secrets.GOOGLE_PHOTOS_CLIENT_SECRET }}
      # Async media pipeline. PUBSUB_TOPIC unset → API processes media inline.
      # The worker is deployed by the separate `deploy-worker` job (in parallel).
      PUBSUB_TOPIC: ${{ vars.PUBSUB_TOPIC }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}

    outputs:
      service_url: ${{ steps.service.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          required=(
            GCP_PROJECT_ID GCP_REGION CLOUD_RUN_SERVICE
            GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT
            DATABASE_URL JWT_SECRET REDIS_URL CORS_ALLOWED_ORIGINS
            JWT_ACCESS_TTL JWT_REFRESH_TTL SUPABASE_URL
            GEOCODER_ENABLED
            RATE_LIMIT_ENABLED RATE_LIMIT_REQUESTS_PER_MINUTE RATE_LIMIT_BURST
          )

          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub variables/secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Create runtime environment file
        shell: bash
        run: |
          runtime_env="$RUNNER_TEMP/runtime-env.json"

          jq -n \
            --arg APP_ENV "production" \
            --arg CORS_ALLOWED_ORIGINS "$CORS_ALLOWED_ORIGINS" \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg JWT_SECRET "$JWT_SECRET" \
            --arg JWT_ACCESS_TTL "$JWT_ACCESS_TTL" \
            --arg JWT_REFRESH_TTL "$JWT_REFRESH_TTL" \
            --arg SUPABASE_URL "$SUPABASE_URL" \
            --arg R2_ACCOUNT_ID "$R2_ACCOUNT_ID" \
            --arg R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID" \
            --arg R2_ACCESS_KEY_SECRET "$R2_ACCESS_KEY_SECRET" \
            --arg R2_BUCKET_NAME "$R2_BUCKET_NAME" \
            --arg R2_PUBLIC_URL "$R2_PUBLIC_URL" \
            --arg REDIS_URL "$REDIS_URL" \
            --arg GEOCODER_ENABLED "$GEOCODER_ENABLED" \
            --arg LOCATIONIQ_API_KEY "$LOCATIONIQ_API_KEY" \
            --arg RATE_LIMIT_ENABLED "$RATE_LIMIT_ENABLED" \
            --arg RATE_LIMIT_REQUESTS_PER_MINUTE "$RATE_LIMIT_REQUESTS_PER_MINUTE" \
            --arg RATE_LIMIT_BURST "$RATE_LIMIT_BURST" \
            --arg FRONTEND_URL "$FRONTEND_URL" \
            --arg GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID" \
            --arg GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET" \
            --arg GOOGLE_PHOTOS_CLIENT_ID "$GOOGLE_PHOTOS_CLIENT_ID" \
            --arg GOOGLE_PHOTOS_CLIENT_SECRET "$GOOGLE_PHOTOS_CLIENT_SECRET" \
            --arg GCP_PROJECT_ID "$GCP_PROJECT_ID" \
            --arg PUBSUB_TOPIC "$PUBSUB_TOPIC" \
            --arg SUPABASE_ANON_KEY "$SUPABASE_ANON_KEY" \
            '{
              ENV: $APP_ENV,
              CORS_ALLOWED_ORIGINS: $CORS_ALLOWED_ORIGINS,
              DATABASE_URL: $DATABASE_URL,
              JWT_SECRET: $JWT_SECRET,
              JWT_ACCESS_TTL: $JWT_ACCESS_TTL,
              JWT_REFRESH_TTL: $JWT_REFRESH_TTL,
              SUPABASE_URL: $SUPABASE_URL,
              R2_ACCOUNT_ID: $R2_ACCOUNT_ID,
              R2_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID,
              R2_ACCESS_KEY_SECRET: $R2_ACCESS_KEY_SECRET,
              R2_BUCKET_NAME: $R2_BUCKET_NAME,
              R2_PUBLIC_URL: $R2_PUBLIC_URL,
              REDIS_URL: $REDIS_URL,
              GEOCODER_ENABLED: $GEOCODER_ENABLED,
              LOCATIONIQ_API_KEY: $LOCATIONIQ_API_KEY,
              RATE_LIMIT_ENABLED: $RATE_LIMIT_ENABLED,
              RATE_LIMIT_REQUESTS_PER_MINUTE: $RATE_LIMIT_REQUESTS_PER_MINUTE,
              RATE_LIMIT_BURST: $RATE_LIMIT_BURST,
              FRONTEND_URL: $FRONTEND_URL,
              GOOGLE_DRIVE_CLIENT_ID: $GOOGLE_DRIVE_CLIENT_ID,
              GOOGLE_DRIVE_CLIENT_SECRET: $GOOGLE_DRIVE_CLIENT_SECRET,
              GOOGLE_PHOTOS_CLIENT_ID: $GOOGLE_PHOTOS_CLIENT_ID,
              GOOGLE_PHOTOS_CLIENT_SECRET: $GOOGLE_PHOTOS_CLIENT_SECRET,
              GCP_PROJECT_ID: $GCP_PROJECT_ID,
              PUBSUB_TOPIC: $PUBSUB_TOPIC,
              SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
            }' > "$runtime_env"

          if ! jq -e 'all(.[]; type == "string")' "$runtime_env" >/dev/null; then
            echo "::error::Runtime environment file contains a non-string value"
            exit 1
          fi

          chmod 600 "$runtime_env"

      - name: Deploy source to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --port 8080 \
            --env-vars-file "$RUNNER_TEMP/runtime-env.json" \
            --quiet

      - name: Read service URL
        id: service
        run: |
          url="$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --format='value(status.url)')"

          if [[ -z "$url" ]]; then
            echo "::error::Cloud Run did not return a service URL"
            exit 1
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Remove runtime environment file
        if: always()
        run: rm -f "$RUNNER_TEMP/runtime-env.json"

      - name: Notify deploy result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} <b>[Backend]</b> Deploy: ${{ job.status == 'success' && 'passed' || 'failed' }}
            ${{ job.status == 'success' && format(' → {0}', steps.service.outputs.url) || '' }}

  deploy-worker:
    name: Deploy media worker
    needs: [notify-start, test, migrate]
    # Runs in parallel with `deploy`. Skipped unless Pub/Sub is configured.
    if: ${{ always() && needs.test.result == 'success' && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && vars.PUBSUB_TOPIC != '' }}
    runs-on: self-hosted
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      WORKER_SERVICE: ${{ vars.CLOUD_RUN_WORKER_SERVICE }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_ACCESS_KEY_SECRET: ${{ secrets.R2_ACCESS_KEY_SECRET }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy worker source to Cloud Run
        run: |
          worker_service="${WORKER_SERVICE:-checkpoint-worker}"
          worker_env="$RUNNER_TEMP/worker-env.json"
          trap 'rm -f "$worker_env"' EXIT

          jq -n \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg R2_ACCOUNT_ID "$R2_ACCOUNT_ID" \
            --arg R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID" \
            --arg R2_ACCESS_KEY_SECRET "$R2_ACCESS_KEY_SECRET" \
            --arg R2_BUCKET_NAME "$R2_BUCKET_NAME" \
            --arg R2_PUBLIC_URL "$R2_PUBLIC_URL" \
            '{
              DATABASE_URL: $DATABASE_URL,
              R2_ACCOUNT_ID: $R2_ACCOUNT_ID,
              R2_ACCESS_KEY_ID: $R2_ACCESS_KEY_ID,
              R2_ACCESS_KEY_SECRET: $R2_ACCESS_KEY_SECRET,
              R2_BUCKET_NAME: $R2_BUCKET_NAME,
              R2_PUBLIC_URL: $R2_PUBLIC_URL
            }' > "$worker_env"

          if ! jq -e 'all(.[]; type == "string")' "$worker_env" >/dev/null; then
            echo "::error::Worker environment file contains a non-string value"
            exit 1
          fi
          chmod 600 "$worker_env"

          # gcloud run deploy --source reads ./Dockerfile; the worker needs the
          # ffmpeg image, so use Dockerfile.worker (safe — the checkout is
          # ephemeral and separate from the parallel API job). The image's
          # ENTRYPOINT is /worker, so no --command override is needed.
          cp Dockerfile.worker Dockerfile

          # Private — only the Pub/Sub push SA may invoke it (see DEPLOY.md §5.7).
          gcloud run deploy "$worker_service" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --source . \
            --port 8080 \
            --no-allow-unauthenticated \
            --concurrency 4 --cpu 2 --memory 1Gi --timeout 300 --min-instances 0 \
            --env-vars-file "$worker_env" \
            --quiet

      - name: Notify worker deploy result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} <b>[Backend]</b> Worker deploy: ${{ job.status == 'success' && 'passed' || 'failed' }}"

  health-check:
    name: Health check
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Check Cloud Run health endpoint
        env:
          SERVICE_URL: ${{ needs.deploy.outputs.service_url }}
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors "$SERVICE_URL/health"

      - name: Notify health-check result
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: "${{ job.status == 'success' && '✅' || '❌' }} <b>[Backend]</b> Health-check: ${{ job.status == 'success' && 'passed' || 'failed' }}"
